services:
  web:
    build: ./backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - mongo

  db:
    image: mysql:8.4
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
      - ./database/creation_base.sql:/docker-entrypoint-initdb.d/01_creation_base.sql
      - ./database/donnees_chambres.sql:/docker-entrypoint-initdb.d/02_donnees_chambres.sql

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

  mongo:
    image: mongo:7
    env_file: .env
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/creation_utilisateur.js:/docker-entrypoint-initdb.d/01_creation_utilisateur.js

volumes:
  db_data:
  mongo_data:
