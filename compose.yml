services:
  web:
    build: ./backend
    env_file: .env
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - mongo

  db:
    image: mysql:8.4
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
      - ./database/creation_base.sql:/docker-entrypoint-initdb.d/01_creation_base.sql
      - ./database/donnees_chambres.sql:/docker-entrypoint-initdb.d/02_donnees_chambres.sql

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

  mongo:
    image: mongo:7
    env_file: .env
    volumes:
      - mongo_data:/data/db

volumes:
  db_data:
  mongo_data:
